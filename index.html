<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GulyTasty | Handcrafted Soaps</title>
  <meta name="description" content="Conoce las redes sociales de GulyTasty, handcrafted soaps.">
  <style>
    :root {
      color-scheme: light;
      --background: #fffaf9;
      --border: #f0dfe0;
      --logo-background: #f4dfe2;
      --logo-border: #e8c8ce;
      --rose: #a65c70;
      --text: #704c55;
      --muted: #8d7378;
      --button: #e8bfc6;
      --button-hover: #ddaeb8;
      --button-text: #5f3e47;
      --footer: #ad9297;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .gt-page {
      width: 100%;
      max-width: 420px;
      padding: 28px 18px 32px;
      text-align: center;
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: 24px;
      color: var(--text);
    }

    .gt-logo {
      width: 78px;
      height: 78px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: var(--logo-background);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--rose);
      font-size: 30px;
      font-weight: 700;
      border: 1px solid var(--logo-border);
    }

    h1 {
      margin: 0;
      font-size: 29px;
      line-height: 1.2;
      letter-spacing: 0.5px;
      color: var(--rose);
    }

    .subtitle {
      margin: 8px 0 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .gt-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .gt-links a {
      display: block;
      padding: 14px 18px;
      border-radius: 12px;
      text-decoration: none;
      background: var(--button);
      color: var(--button-text);
      font-size: 16px;
      font-weight: 600;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .gt-links a:hover,
    .gt-links a:focus-visible {
      background: var(--button-hover);
      transform: translateY(-1px);
    }

    .gt-links a:focus-visible {
      outline: 3px solid #d7a2ad;
      outline-offset: 3px;
    }

    .gt-footer {
      margin-top: 26px;
      font-size: 12px;
      color: var(--footer);
    }

    @media (max-width: 360px) {
      body {
        padding: 16px 12px;
      }

      .gt-page {
        padding: 24px 14px 28px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <main class="gt-page" aria-labelledby="brand-name">
    <div class="gt-logo" aria-hidden="true">G</div>

    <h1 id="brand-name">GulyTasty</h1>
    <p class="subtitle">Handcrafted Soaps</p>

    <nav class="gt-links" aria-label="Redes sociales de GulyTasty">
      <a
        href="https://www.instagram.com/guly_tasty/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Instagram · @guly_tasty
      </a>

      <a
        href="https://www.tiktok.com/@guly.tasty"
        target="_blank"
        rel="noopener noreferrer"
      >
        TikTok · @guly.tasty
      </a>

      <a
        href="https://www.facebook.com/share/1BtT2KGce4/?mibextid=wwXIfr"
        target="_blank"
        rel="noopener noreferrer"
      >
        Facebook
      </a>
    </nav>

    <div class="gt-footer">Handmade with love ♡</div>
  </main>
</body>
</html>
